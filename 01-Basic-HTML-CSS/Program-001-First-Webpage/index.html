
<!DOCTYPE html>
<!-- This tells the browser that we are using HTML5 -->

<html lang="en">
<!-- This is the main HTML element. The page language is English. -->

<head>
    <!-- The head section contains webpage information -->

    <meta charset="UTF-8">
    <!-- This supports English, Hindi and special characters -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- This makes the webpage responsive on mobile devices -->

    <title>My First Website</title>
    <!-- This title appears in the browser tab -->

    <link rel="stylesheet" href="style.css">
    <!-- This connects the external CSS file -->
</head>

<body>
    <!-- The body contains all visible webpage content -->

    <div class="container">
        <!-- This div groups all webpage content -->

        <h1>Welcome to My First Website!</h1>
        <!-- This is the main heading of the webpage -->

        <p>Hello! My name is Pankaj.</p>
        <!-- This paragraph introduces the author -->

        <h2>About Me</h2>
        <!-- This is a second-level heading -->

        <p>
            I am learning HTML and CSS.
            This is my first webpage.
        </p>
        <!-- This paragraph gives a short introduction -->

        <h2>My Skills</h2>
        <!-- This heading introduces the skills section -->

        <ul>
            <!-- This creates an unordered list -->

            <li>HTML</li>
            <!-- This is the first list item -->

            <li>CSS</li>
            <!-- This is the second list item -->

            <li>Learning Web Development</li>
            <!-- This is the third list item -->
        </ul>

        <a href="https://www.google.com" class="btn">
            Visit Google
        </a>
        <!-- This creates a link styled like a button -->

    </div>

</body>
<!-- This closes the body section -->

</html>
<!-- This closes the HTML document -->
