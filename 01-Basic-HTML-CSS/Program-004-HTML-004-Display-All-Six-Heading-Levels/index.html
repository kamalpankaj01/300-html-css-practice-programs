<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>HTML Heading Tags H1 to H6 Example</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f2f6ff;
      padding: 30px;
    }

    h1 {
      color: #ff6600;
      font-size: 36px;
    }

    h2 {
      color: #008000;
      font-size: 30px;
    }

    h3 {
      color: #0066cc;
      font-size: 26px;
    }

    h4 {
      color: #9933cc;
      font-size: 22px;
    }

    h5 {
      color: #cc6600;
      font-size: 20px;
    }

    h6 {
      color: #444444;
      font-size: 18px;
    }
  </style>

</head>

<body>

  <h1>This is Heading 1</h1>
  <h2>This is Heading 2</h2>
  <h3>This is Heading 3</h3>
  <h4>This is Heading 4</h4>
  <h5>This is Heading 5</h5>
  <h6>This is Heading 6</h6>

</body>

</html>
